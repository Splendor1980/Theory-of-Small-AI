# Облачная сборка APK (GitHub Actions, бесплатно) для игр Agent 1.
# Слабая машина НЕ тащит Android SDK/JDK — сборка идёт в облаке.
#
# Поток: make_project.py (Python stdlib) готовит Godot-проект под игру,
# затем Godot headless экспортит Android APK. Export Templates обязательны
# (без них --export-debug падает).
#
# Запуск:
#   - вручную: Actions → build-apk → Run workflow → idea (по умолчанию змейка)
#   - по push в main

name: build-apk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Идея игры (напр. «змейка на конфетах», «neon пинг-понг»)"
        required: false
        default: "змейка на конфетах"
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Готовим Godot-проект под конкретную игру (только stdlib)
      - name: Prepare project (make_project.py)
        run: |
          IDEA="${{ github.event.inputs.idea || 'змейка на конфетах' }}"
          python -m agent1.tools.make_project "$IDEA" --out project_build
          ls -R project_build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2) Дебажный keystore: генерируем прямо в CI, если нет своего
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV

      - name: Download Godot headless
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot.x86_64
          chmod +x godot.x86_64

      # 3) Export Templates обязательны для --export-debug
      - name: Download Godot export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/et
          mv /tmp/et/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          # Gradle-export требует res://android/build/build.gradle И res://android/.build_version.
          # android_source.zip содержит файлы android-проекта на корне
          # (build.gradle, AndroidManifest.xml, src/, ...) — распаковываем
          # в project_build/android/build/, чтобы they попали в res://android/build/.
          echo "== contents of android_source.zip (top 15) =="
          unzip -l ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip | head -15
          mkdir -p project_build/android/build
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d project_build/android/build
          echo "== res://android/build/ contents =="
          ls project_build/android/build/
          test -f project_build/android/build/build.gradle && echo "OK: build.gradle found" || echo "FAIL: build.gradle NOT found"
          # Gradle-export читает res://android/.build_version и сверяет с версией Godot.
          # Обычно его создаёт Project -> Install Android Build Template; в CI ставим вручную.
          printf '%s\n' "${GODOT_VERSION}.stable" > project_build/android/.build_version
          cat project_build/android/.build_version
          # .gdignore не даёт Godot импортировать ресурсы шаблона (splash.png и т.п.),
          # иначе рендерер Godot создаёт *.png.import, который ломает gradle :mergeDebugResources
          # ("The file name must end with .xml or .png"). FileAccess и gradle это не затрагивает.
          touch project_build/android/.gdignore
          # Также кладём в userdata (fallback path)
          mkdir -p ~/.local/share/godot/android/build_templates
          unzip -o -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d ~/.local/share/godot/android/build_templates

      - name: Check GDScript (headless --check-only)
        run: |
          ./godot.x86_64 --headless --path project_build --check-only || true

      # 3b) Godot требует Android SDK и Java пути в Editor Settings для gradle-экспорта.
      #     Используем printf (не heredoc): heredoc с YAML-отступами ломает формат .tres.
      - name: Configure Godot editor settings (Android SDK + Java)
        run: |
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path=\"$ANDROID_HOME\"" \
            "export/android/java_sdk_path=\"$JAVA_HOME\"" \
            "export/android/android_build_tools_picker=\"1\"" > "$SETTINGS"
          echo "---- $SETTINGS ----"
          cat "$SETTINGS"
          echo "---- godot editor settings path (first run creates defaults) ----"
          ./godot.x86_64 --headless --path project_build --quit 2>&1 | head -20

      # 4) Сборка APK; keystore подаём через env → подставится в export_presets.cfg
      - name: Export APK
        env:
          ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_DEBUG_USER: "androiddebugkey"
          ANDROID_KEYSTORE_DEBUG_PASS: "android"
        run: |
          # Godot сам не всегда раскрывает ${VAR} в пресете — подставляем реальный путь явно
          sed -i "s|\${ANDROID_KEYSTORE_DEBUG_PATH}|${ANDROID_KEYSTORE_DEBUG_PATH}|g" project_build/export_presets.cfg
          sed -i "s|\${ANDROID_KEYSTORE_DEBUG_USER}|${ANDROID_KEYSTORE_DEBUG_USER}|g" project_build/export_presets.cfg
          sed -i "s|\${ANDROID_KEYSTORE_DEBUG_PASS}|${ANDROID_KEYSTORE_DEBUG_PASS}|g" project_build/export_presets.cfg
          grep -n "keystore/debug" project_build/export_presets.cfg
          mkdir -p build/android
          ./godot.x86_64 --headless --path project_build --export-debug "Android" 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: project_build/build/android/game.apk
          if-no-files-found: error
